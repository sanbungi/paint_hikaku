name: CI
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  # Unsigned builds: never search the runner for code-signing certificates.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth fonts-noto-cjk
      - run: npm ci
      - run: npm run build
      - name: Unit and scenario regressions
        run: npm test
      - name: GUI regressions (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npm run test:gui
      - name: GUI regressions (Windows)
        if: runner.os == 'Windows'
        run: npm run test:gui
      - name: Smoke test from source (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/run-checks.js --name smoke --expect "PASS GUI-SMOKE" -- node_modules/.bin/electron . --no-sandbox --smoke-test
      - name: Smoke test from source (Windows)
        if: runner.os == 'Windows'
        run: node scripts/run-checks.js --name smoke --expect "PASS GUI-SMOKE" -- node_modules/electron/dist/electron.exe . --smoke-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: warn

  windows:
    name: Windows exe
    needs: test
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - name: Build portable exe and installer
        run: npm run dist:win
      - name: Smoke test the packaged app
        run: node scripts/run-checks.js --name packaged-windows --expect "PASS GUI-SMOKE" -- dist/win-unpacked/paint_hikaku.exe --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: paint_hikaku-windows-exe
          path: dist/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-windows-logs
          path: test-results/
          if-no-files-found: ignore

  linux:
    name: Linux AppImage
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - run: npm ci
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - run: npm run dist:linux
      - name: Smoke test the AppImage
        run: |
          appimage=(dist/*.AppImage)
          xvfb-run -a node scripts/run-checks.js --name packaged-linux --expect "PASS GUI-SMOKE" -- "${appimage[0]}" --appimage-extract-and-run --no-sandbox --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: paint_hikaku-linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: paint_hikaku-*
          path: release
          merge-multiple: true
      - name: Publish verified binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: release
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected vMAJOR.MINOR.PATCH'; exit 1; }
          sha256sum -- *.exe *.AppImage > SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes *.exe *.AppImage SHA256SUMS
