name: CI
# Tests and the Windows exe build run in parallel; only a release waits for both.
# Every push builds the portable exe (downloadable from the run's Artifacts);
# the installer and the AppImage are built for v* tags only.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  # Unsigned builds: never search the runner for code-signing certificates.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
jobs:
  test:
    name: Test
    # Branch pushes already run CI; pull requests only need it when they come from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Electron's own download cache (outside the repo: its tools must not see our package.json).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Virtual display
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb xauth)
      - run: npm ci
      - run: npm run build
      - name: Unit and scenario regressions
        run: npm test
      - name: GUI regressions
        run: xvfb-run -a -s '-screen 0 1920x1080x24' node --test --test-concurrency=1 "test/gui/*.test.js"
      - name: Smoke test from source
        run: xvfb-run -a node scripts/run-checks.js --name smoke --expect "PASS GUI-SMOKE" -- node_modules/.bin/electron . --no-sandbox --smoke-test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

  windows:
    name: Windows exe
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Unit tests (Windows paths and file names)
        run: npm test
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - name: Build portable exe (and the installer for releases)
        shell: bash
        run: |
          npm run build
          # Everyday builds: portable exe with the app stored uncompressed (LZMA took ~2 min; the
          # artifact zip compresses it for download, and the exe starts faster without unpacking).
          # Releases: compressed portable exe plus the installer.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            npx electron-builder --win portable nsis --x64 --publish never
          else
            npx electron-builder --win portable --x64 --publish never -c.compression=store
          fi
      - name: Smoke test the packaged app
        run: node scripts/run-checks.js --name packaged-windows --expect "PASS GUI-SMOKE" -- dist/win-unpacked/paint_hikaku.exe --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: paint_hikaku-windows-exe
          path: dist/*.exe
          if-no-files-found: error
          compression-level: ${{ startsWith(github.ref, 'refs/tags/v') && 0 || 1 }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: packaged-windows-logs
          path: test-results/
          if-no-files-found: ignore

  linux:
    name: Linux AppImage
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb xauth)
      - run: npm ci
      - run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - run: npm run dist:linux
      - name: Smoke test the AppImage
        run: |
          appimage=(dist/*.AppImage)
          xvfb-run -a node scripts/run-checks.js --name packaged-linux --expect "PASS GUI-SMOKE" -- "${appimage[0]}" --appimage-extract-and-run --no-sandbox --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: paint_hikaku-linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: paint_hikaku-*
          path: release
          merge-multiple: true
      - name: Publish verified binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: release
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected vMAJOR.MINOR.PATCH'; exit 1; }
          sha256sum -- *.exe *.AppImage > SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes *.exe *.AppImage SHA256SUMS
